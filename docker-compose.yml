services:
  postgres:
    image: postgres:16-alpine
    container_name: kinetix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kinetix_proptech
      POSTGRES_USER: kinetix
      POSTGRES_PASSWORD: ${KINETIX_DB_PASSWORD:-kinetix_dev_secure_2026}
    ports:
      - "5432:5432"
    volumes:
      - kinetix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinetix -d kinetix_proptech"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kinetix-net

  redis:
    image: redis:7-alpine
    container_name: kinetix-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - kinetix_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - kinetix-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kinetix-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=kinetix_proptech;Username=kinetix;Password=${KINETIX_DB_PASSWORD:-kinetix_dev_secure_2026}
      ConnectionStrings__Redis: redis:6379
      Kinetix__DefaultCorsOrigins__0: http://localhost:8080
      Kinetix__DefaultCorsOrigins__1: http://localhost:5173
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kinetix-net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kinetix-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - kinetix-net

volumes:
  kinetix_pgdata:
  kinetix_redisdata:

networks:
  kinetix-net:
    driver: bridge
